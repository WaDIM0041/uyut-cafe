<!-- =============================================================
     AK · annakam.ru — badge-ссылка на создателя сайта
     Самодостаточный код: HTML + CSS в одном блоке.
     Вставьте этот фрагмент в <footer> (или куда удобно) любого сайта.
     ============================================================= -->

<style>
  .ak-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 6px 12px 6px 8px;
    border-radius: 10px;
    background: linear-gradient(150deg, rgba(28,22,16,0.7), rgba(20,16,12,0.55));
    border: 1px solid rgba(0,204,255,0.32);
    color: #c7c7c7;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-decoration: none;
    backdrop-filter: blur(10px);
    transition: transform .3s ease, border-color .3s, box-shadow .3s;
  }
  .ak-badge:hover {
    transform: translateY(-2px);
    border-color: rgba(0,204,255,0.7);
    box-shadow: 0 10px 22px rgba(0,204,255,0.16);
  }

  /* Ромб с монограммой АК — cyan-градиент в стилистике annakam.ru */
  .ak-badge__mark {
    flex: none;
    width: 22px; height: 22px;
    display: grid;
    place-items: center;
    position: relative;
    transform: rotate(45deg);
    border-radius: 5px;
    background: linear-gradient(140deg, #00ccff 0%, #36e7ff 55%, #6f93ff 100%);
    box-shadow: 0 0 10px rgba(0,204,255,0.5), inset 0 0 0 1px rgba(255,255,255,0.35);
  }
  .ak-badge__mark::after {
    content: "";
    position: absolute; inset: 3px;
    border: 1px solid rgba(3,6,10,0.45);
    border-radius: 3px;
  }
  .ak-badge__mark-txt {
    transform: rotate(-45deg);
    font-weight: 800;
    font-size: 0.5rem;
    letter-spacing: 0.02em;
    color: #03060a;
  }

  .ak-badge__text { display: flex; flex-direction: column; line-height: 1.2; }
  .ak-badge__text small {
    color: #8a8a8a;
    font-size: 0.62rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .ak-badge__text b {
    color: #d8f4ff;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: color .3s;
  }
  .ak-badge:hover .ak-badge__text b { color: #00ccff; }

  @media (prefers-reduced-motion: reduce) {
    .ak-badge, .ak-badge:hover { transition: none; transform: none; }
  }
</style>

<a class="ak-badge"
   href="https://annakam.ru"
   target="_blank"
   rel="noopener"
   aria-label="Сайт разработан — Анна Камчатка, annakam.ru"
   title="Сайт разработан — Анна Камчатка, annakam.ru">
  <span class="ak-badge__mark" aria-hidden="true">
    <span class="ak-badge__mark-txt">AK</span>
  </span>
  <span class="ak-badge__text">
    <small>Сайт разработан</small>
    <b>Анна Камчатка · annakam.ru</b>
  </span>
</a>
